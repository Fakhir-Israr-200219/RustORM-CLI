
[package]
name = "RustORM-CLI"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustorm"
path = "src/main.rs"

[dependencies]
notify = "7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
dotenvy = "0.15"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
